# nginx Cache-Control Snippet für planexus.de (Astro Static Build)
#
# Einbindung in den bestehenden server-Block:
#
#   server {
#       listen 443 ssl http2;
#       server_name planexus.de www.planexus.de;
#       root /var/www/planexus/dist/client;
#
#       include /etc/nginx/snippets/planexus-cache.conf;
#
#       location / {
#           try_files $uri $uri/ /index.html;
#       }
#   }
#
# Datei auf dem Server ablegen:
#   sudo cp docs/nginx-cache.conf /etc/nginx/snippets/planexus-cache.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Hashed Build-Assets (JS, CSS) — Dateiname enthält Content-Hash, sicher immutable
location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Explizite HTML-Dateien (Pre-rendered Pages mit .html-Endung)
location ~* \.html$ {
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
}

# Clean URLs ohne Endung: add_header im bestehenden location / Block ergänzen:
#   add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
