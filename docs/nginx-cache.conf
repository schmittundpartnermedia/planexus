# nginx Cache-Control Snippet für planexus.de (Reverse Proxy → Node :5000)
#
# Die Site-Config mit www/Slash in einem 301 liegt unter docs/nginx/.
# Dieses File bleibt nur Cache-Header für /_astro/ und HTML.

location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    proxy_pass http://127.0.0.1:5000;
}
