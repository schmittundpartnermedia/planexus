# planexus.de — Canonical-Host ohne www, HTTPS, Pfad ohne Trailing Slash (Startseite mit /).
# www + Slash + HTTP in EINEM 301 auf https://planexus.de… (Query bleibt).
#
# Einspielen:
#   sudo cp docs/nginx/planexus-uri-map.conf /etc/nginx/conf.d/planexus-uri-map.conf
#   sudo cp docs/nginx/planexus-redirects.conf /etc/nginx/snippets/planexus-redirects.conf
#   sudo cp docs/nginx/planexus.de.conf /etc/nginx/sites-available/planexus.de
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name planexus.de www.planexus.de;

    include snippets/planexus-redirects.conf;

    location / {
        if ($uri != $planexus_canonical_uri) {
            return 301 https://planexus.de$planexus_canonical_uri$is_args$args;
        }
        return 301 https://planexus.de$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name planexus.de;

    ssl_certificate     /etc/letsencrypt/live/planexus.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planexus.de/privkey.pem;

    include snippets/planexus-redirects.conf;

    location /_astro/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/planexus-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        if ($uri != $planexus_canonical_uri) {
            return 301 $planexus_canonical_uri$is_args$args;
        }
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        include snippets/planexus-headers.conf;
        add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=86400" always;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.planexus.de;

    ssl_certificate     /etc/letsencrypt/live/planexus.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planexus.de/privkey.pem;

    include snippets/planexus-redirects.conf;

    location / {
        if ($uri != $planexus_canonical_uri) {
            return 301 https://planexus.de$planexus_canonical_uri$is_args$args;
        }
        return 301 https://planexus.de$request_uri;
    }
}
