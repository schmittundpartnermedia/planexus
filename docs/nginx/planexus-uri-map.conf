# Canonical-URL-Map (http-Kontext, vor sites-enabled laden)
# Dateien mit Endung + Slash nicht umschreiben; sonst Trailing Slash strippen.
# Startseite `/` matcht nicht auf ^(.+)/$ → bleibt `/`.

map $uri $planexus_canonical_uri {
    ~*\.[A-Za-z0-9]+/$  $uri;
    ~^(.+)/$            $1;
    default             $uri;
}
