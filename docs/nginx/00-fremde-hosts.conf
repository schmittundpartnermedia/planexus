# Auffang-Block: Anfragen, deren Host weder planexus.de noch www.planexus.de ist, werden abgewiesen.
# Ohne ihn landete jeder Host bei der App (erster 443-Block = Standard), und Astro holte seine Fehlerseite
# vom angefragten Host – der Server rief fremde Adressen auf (Protokoll: nycrailfan.website) und hing bis zum 504.
# Live seit 12.10.2026 als /etc/nginx/sites-available/00-fremde-hosts (Link in sites-enabled), lädt vor planexus.de.
# http2 wie in planexus.de.conf, sonst warnt nginx „protocol options redefined“.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}
