# Cache-Control je Pfad (http-Kontext, liegt live unter /etc/nginx/conf.d/planexus-cache-map.conf)
# Admin-Bereich und API nie zwischenspeichern, alle anderen Seiten wie bisher.

map $uri $planexus_cache_control {
    ~^/(admin|api)(/|$)  "no-store";
    default              "public, max-age=0, s-maxage=300, stale-while-revalidate=86400";
}
