# planexus.de — gzip auch für CSS, JavaScript, SVG, JSON und Text.
#
# Befund 20.10.2026 (curl + Lighthouse): HTML kam gepackt, /_astro/*.css und *.js
# ungepackt (ca. 360 KiB unnötige Übertragung pro Erstbesuch). Ursache: Ubuntu-
# Standard „gzip on;“ in /etc/nginx/nginx.conf packt ohne gzip_types nur text/html.
#
# Diese Datei gehört nach /etc/nginx/conf.d/ (wird im http-Block geladen).
# Sie setzt bewusst KEIN „gzip on;“ (steht schon in nginx.conf). Meldet nginx -t
# „duplicate“, ist die betreffende Zeile in nginx.conf schon aktiv – dann hier löschen.
#
# Einspielen (nur wenn nginx -t „successful“ meldet, wird neu geladen):
#   cp /var/www/app/docs/nginx/planexus-gzip.conf /etc/nginx/conf.d/planexus-gzip.conf
#   nginx -t && systemctl reload nginx

gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/css
    text/plain
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml;
